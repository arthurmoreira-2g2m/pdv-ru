name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências do app (React/Vite)
        run: npm install

      - name: Build de produção do app (gera dist/)
        run: npm run build

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Cordova CLI
        run: npm install -g cordova

      - name: Criar esqueleto do projeto Cordova
        run: cordova create cordova-project com.twogtwom.refeitorio.app "2G2M Refeitório"

      - name: Substituir www/ pelo build do React
        run: |
          rm -rf cordova-project/www
          cp -r dist cordova-project/www

      - name: Aplicar nosso config.xml (raiz do repositório)
        run: cp config.xml cordova-project/config.xml

      - name: Copiar hooks de correção (AndroidX etc.)
        run: cp -r hooks cordova-project/hooks

      - name: Adicionar plataforma Android
        working-directory: cordova-project
        run: cordova platform add android

      - name: Adicionar plugin nativo da impressora Gertec/Topwise
        working-directory: cordova-project
        run: cordova plugin add ../plugins/cordova-plugin-gertec-printer

      - name: Compilar APK (debug)
        working-directory: cordova-project
        run: cordova build android

      - name: Publicar APK como artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: pdv-2g2m-apk-debug
          path: cordova-project/platforms/android/app/build/outputs/apk/debug/app-debug.apk
